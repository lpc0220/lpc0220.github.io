<text x="360.0" y="112.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Row 3 (blue): query block 3 attends KV blocks 1 and 6, its top-k list.</text>
<text x="360.0" y="140.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Column 6 (orange): KV block 6 was selected by query blocks 2, 3, 4 and 6.</text>
<text x="360.0" y="168.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >dQ of a query block sums over its row; dK and dV of a KV block sum over its column.</text>
<text x="360.0" y="196.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Every row has exactly top-k entries, but column counts vary (here 0 to 4).</text>
<text x="360.0" y="224.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >KV block 4 was selected by no query block: its dK and dV are zero.</text>
