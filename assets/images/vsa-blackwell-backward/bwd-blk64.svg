<text x="920.0" y="180.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600" >query block b3</text>
<text x="920.0" y="198.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >64 KV × 64 query</text>
<text x="642.0" y="106.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400" >lanes 0–63</text>
<text x="642.0" y="186.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400" >64–127</text>
<text x="740.0" y="240.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >cols 0–63</text>
<text x="920.0" y="240.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >cols 64–127</text>
<text x="650.0" y="268.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >dV and dK use the same lane split: lanes 0–63</text>
<text x="650.0" y="286.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >sum over b0, b2, lanes 64–127 over b1, b3;</text>
<text x="650.0" y="304.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >the two partials are added at the end.</text>
<text x="30.0" y="372.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >Each 128-lane tcgen05.mma.ws (Layout E) computes two independent 64-row products, so a 64-row KV block still uses the full tensor core.</text>
<text x="30.0" y="392.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >Sᵀ and dPᵀ are issued as two N=128 MMAs, one per Qᵀ or dOᵀ slot; dV and dK accumulate over slot s0 then s1 (s2 then s3).</text>
<text x="30.0" y="412.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >dQ = dS · K runs as two plain 128-row MMAs per quad (b0 and b2, then b1 and b3); each dQ tile goes to the fp32 accumulator.</text>
<text x="30.0" y="432.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >The loader fills the next quad's dOᵀ slots first: dV frees them before dK frees the Qᵀ slots.</text>
</svg>