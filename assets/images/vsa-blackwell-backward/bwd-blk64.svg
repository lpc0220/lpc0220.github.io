<text x="346.0" y="257.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" >s3 · Qᵀ, b2 b3</text>
<text x="346.0" y="274.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" >freed by dK</text>
<text x="330.0" y="314.0" font-size="11" fill="#8a8984" text-anchor="start" font-weight="400" >K and V: loaded once per CTA.</text>
