<text x="30.0" y="344.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >The 64 × 256 score tile is stored in two halves (tcgen05.mma.ws, Layout E): keys 0–127 in lanes 0–63, keys 128–255 in lanes 64–127.</text>
<text x="30.0" y="364.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >Each softmax thread covers one row of one half; the correction warps merge the two halves of each row.</text>
