<text x="120.0" y="133.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >128 rows · own top-k list A</text>
<line x1="210" y1="117.0" x2="248" y2="117.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="250" y="77.0" width="210" height="80" rx="4" fill="#dbe8f9" stroke="#d6d5d0" stroke-width="1.2"/>
