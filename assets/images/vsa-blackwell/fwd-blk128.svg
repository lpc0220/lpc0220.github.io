<text x="355.0" y="133.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >128 keys = one K/V tile</text>
<line x1="460" y1="117.0" x2="578" y2="117.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="520.0" y="109.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400" >Q·Kᵀ</text>
