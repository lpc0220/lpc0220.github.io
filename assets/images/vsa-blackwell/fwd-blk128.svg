<rect width="1040" height="540" fill="#fcfcfb"/>
<text x="30.0" y="36.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >1 · Two query blocks</text>
<text x="250.0" y="36.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >2 · 1 KV block per step</text>
<text x="580.0" y="36.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >3 · TMEM (128 lanes × 512 columns)</text>
