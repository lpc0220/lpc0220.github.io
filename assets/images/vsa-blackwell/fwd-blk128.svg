<text x="655.0" y="129.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" >cols = 128 keys</text>
<text x="655.0" y="189.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" >S(2p) · cols 0–127</text>
