<text x="520.0" y="261.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400" >Q·Kᵀ</text>
<rect x="580" y="214" width="150" height="110" rx="3" fill="#fbe3d8" stroke="#d6d5d0" stroke-width="1.2"/>
<text x="655.0" y="263.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >lanes 0–127 = rows</text>
<text x="655.0" y="281.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" >cols = 128 keys</text>
<text x="655.0" y="341.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" >S(2p+1) · cols 128–255</text>
<rect x="790" y="214" width="150" height="110" rx="3" fill="#fbe3d8" stroke="#d6d5d0" stroke-width="1.2"/>
<text x="865.0" y="263.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >lanes 0–127 = rows</text>
<text x="865.0" y="281.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" >cols = head dim 128</text>
<text x="865.0" y="341.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" >O(2p+1) · cols 384–511</text>
<line x1="730" y1="269.0" x2="788" y2="269.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="760.0" y="261.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400" >P·V</text>
<text x="30.0" y="384.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >4 · K/V loads into the shared-memory ring, in order</text>
<text x="30.0" y="416.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" >Dense attention</text>
<text x="30.0" y="432.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" >each tile feeds both M-tiles</text>
<rect x="250" y="404" width="46" height="26" rx="3" fill="#eeeeeb" stroke="#d6d5d0" stroke-width="1.2"/><text x="268.0" y="421.0" font-size="12" fill="#0b0b0b" text-anchor="middle">K<tspan dy="3" font-size="9">0</tspan></text>
<rect x="314" y="404" width="46" height="26" rx="3" fill="#eeeeeb" stroke="#d6d5d0" stroke-width="1.2"/><text x="332.0" y="421.0" font-size="12" fill="#0b0b0b" text-anchor="middle">V<tspan dy="3" font-size="9">0</tspan></text>
<rect x="364" y="404" width="46" height="26" rx="3" fill="#eeeeeb" stroke="#d6d5d0" stroke-width="1.2"/><text x="382.0" y="421.0" font-size="12" fill="#0b0b0b" text-anchor="middle">K<tspan dy="3" font-size="9">1</tspan></text>
<rect x="428" y="404" width="46" height="26" rx="3" fill="#eeeeeb" stroke="#d6d5d0" stroke-width="1.2"/><text x="446.0" y="421.0" font-size="12" fill="#0b0b0b" text-anchor="middle">V<tspan dy="3" font-size="9">1</tspan></text>
<rect x="478" y="404" width="46" height="26" rx="3" fill="#eeeeeb" stroke="#d6d5d0" stroke-width="1.2"/><text x="496.0" y="421.0" font-size="12" fill="#0b0b0b" text-anchor="middle">K<tspan dy="3" font-size="9">2</tspan></text>
<text x="538.0" y="421.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >…</text>
<text x="30.0" y="462.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" >128-token blocks</text>
<text x="30.0" y="478.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" >one tile per M-tile: 2× the loads</text>
<rect x="250" y="450" width="46" height="26" rx="3" fill="#dbe8f9" stroke="#d6d5d0" stroke-width="1.2"/><text x="268.0" y="467.0" font-size="12" fill="#0b0b0b" text-anchor="middle">K<tspan dy="3" font-size="9">A0</tspan></text>
<rect x="300" y="450" width="46" height="26" rx="3" fill="#fbe3d8" stroke="#d6d5d0" stroke-width="1.2"/><text x="318.0" y="467.0" font-size="12" fill="#0b0b0b" text-anchor="middle">K<tspan dy="3" font-size="9">B0</tspan></text>
<rect x="364" y="450" width="46" height="26" rx="3" fill="#dbe8f9" stroke="#d6d5d0" stroke-width="1.2"/><text x="382.0" y="467.0" font-size="12" fill="#0b0b0b" text-anchor="middle">V<tspan dy="3" font-size="9">A0</tspan></text>
<rect x="414" y="450" width="46" height="26" rx="3" fill="#dbe8f9" stroke="#d6d5d0" stroke-width="1.2"/><text x="432.0" y="467.0" font-size="12" fill="#0b0b0b" text-anchor="middle">K<tspan dy="3" font-size="9">A1</tspan></text>
<rect x="464" y="450" width="46" height="26" rx="3" fill="#fbe3d8" stroke="#d6d5d0" stroke-width="1.2"/><text x="482.0" y="467.0" font-size="12" fill="#0b0b0b" text-anchor="middle">V<tspan dy="3" font-size="9">B0</tspan></text>
<rect x="514" y="450" width="46" height="26" rx="3" fill="#fbe3d8" stroke="#d6d5d0" stroke-width="1.2"/><text x="532.0" y="467.0" font-size="12" fill="#0b0b0b" text-anchor="middle">K<tspan dy="3" font-size="9">B1</tspan></text>
<rect x="578" y="450" width="46" height="26" rx="3" fill="#dbe8f9" stroke="#d6d5d0" stroke-width="1.2"/><text x="596.0" y="467.0" font-size="12" fill="#0b0b0b" text-anchor="middle">V<tspan dy="3" font-size="9">A1</tspan></text>
<rect x="628" y="450" width="46" height="26" rx="3" fill="#dbe8f9" stroke="#d6d5d0" stroke-width="1.2"/><text x="646.0" y="467.0" font-size="12" fill="#0b0b0b" text-anchor="middle">K<tspan dy="3" font-size="9">A2</tspan></text>
<rect x="678" y="450" width="46" height="26" rx="3" fill="#fbe3d8" stroke="#d6d5d0" stroke-width="1.2"/><text x="696.0" y="467.0" font-size="12" fill="#0b0b0b" text-anchor="middle">V<tspan dy="3" font-size="9">B1</tspan></text>
<rect x="728" y="450" width="46" height="26" rx="3" fill="#fbe3d8" stroke="#d6d5d0" stroke-width="1.2"/><text x="746.0" y="467.0" font-size="12" fill="#0b0b0b" text-anchor="middle">K<tspan dy="3" font-size="9">B2</tspan></text>
<text x="788.0" y="467.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >…</text>
<text x="30.0" y="512.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >Four softmax warps own S(2p) and four own S(2p+1), one thread per row. P (bf16) overwrites S in place, and P·V reads it from TMEM.</text>
<text x="30.0" y="532.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >Each step, the MMA warp runs P·V and the next Q·Kᵀ for one query block, then the other, so each block's softmax overlaps the other's MMAs.</text>
</svg>