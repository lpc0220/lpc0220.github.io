<text x="865.0" y="129.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" >cols = head dim 128</text>
<text x="865.0" y="189.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" >O(2p) · cols 256–383</text>
<line x1="730" y1="117.0" x2="788" y2="117.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="760.0" y="109.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400" >P·V</text>
<rect x="30" y="229.0" width="180" height="80" rx="6" fill="#fbe3d8" stroke="#d6d5d0" stroke-width="1.2"/>
<text x="120.0" y="265.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" >q block 2p+1</text>
<text x="120.0" y="285.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" >128 rows · own top-k list B</text>
<line x1="210" y1="269.0" x2="248" y2="269.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
