<text x="70.0" y="284.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400" >Row 3: query block 3 attends only KV blocks 1 and 6.</text>
<text x="360.0" y="84.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600" >VSA's fine stage is block-sparse attention.</text>
<text x="360.0" y="112.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Tokens are grouped into blocks: 64-token (4×4×4) video cubes by default.</text>
<text x="360.0" y="140.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >A coarse stage scores pooled blocks and keeps the top-k KV blocks per query block.</text>
<text x="360.0" y="168.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Each query block then attends exactly to the tokens of its own top-k list.</text>
<text x="360.0" y="196.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Neighbouring query blocks generally select different lists.</text>
<text x="360.0" y="224.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >At 25% density (top-k = 2 of 8 here) the work is a quarter of dense attention.</text>
